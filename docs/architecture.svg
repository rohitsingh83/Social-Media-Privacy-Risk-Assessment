<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">PRIVACY//FIELD system architecture</title>
  <desc id="desc">A privacy questionnaire flows through validation and in-memory feature scoring, then to findings, dashboard, recommendations, simulator, report, and derived-only SQLite. A separate synthetic CSV feeds aggregate demo analytics.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1115"/><stop offset="1" stop-color="#142325"/></linearGradient>
    <linearGradient id="mint" x2="1"><stop stop-color="#48d7ad"/><stop offset="1" stop-color="#deff79"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a4ffd7"/></marker>
    <style>
      .title{font:800 30px system-ui,sans-serif;fill:#edf4ef;letter-spacing:-1px}.kicker{font:11px monospace;fill:#a4ffd7;letter-spacing:2px}.label{font:700 14px system-ui,sans-serif;fill:#e9f2ed}.small{font:11px system-ui,sans-serif;fill:#8fa39b}.mono{font:10px monospace;fill:#98aaa3;letter-spacing:1px}.box{fill:#132126;stroke:#36534d;stroke-width:1.4;rx:14}.box2{fill:#17252a;stroke:#44625b;stroke-width:1.2;rx:12}.safe{fill:#162e2b;stroke:#85e8bd;stroke-width:1.5;rx:14}.sink{fill:#1a2628;stroke:#82c4a9;stroke-width:1.5;rx:14}.arrow{fill:none;stroke:#a4ffd7;stroke-width:2;marker-end:url(#arrow);opacity:.82}.dash{stroke-dasharray:6 7;opacity:.55}.num{font:10px monospace;fill:#dcff7a}
    </style>
  </defs>
  <rect width="1200" height="850" fill="url(#bg)"/>
  <circle cx="1030" cy="95" r="170" fill="#58e5b0" opacity=".035"/>
  <circle cx="1030" cy="95" r="118" fill="none" stroke="#a4ffd7" opacity=".12"/>
  <text x="65" y="66" class="kicker">DEFENSIVE SELF-ASSESSMENT / DATA-MINIMIZED FLOW</text>
  <text x="65" y="108" class="title">PRIVACY//FIELD · System Architecture</text>
  <text x="65" y="135" class="small">No profile connection · No scraping · No raw response persistence</text>

  <!-- primary flow -->
  <rect x="75" y="182" width="210" height="82" class="box"/>
  <text x="105" y="215" class="num">01 / INPUT</text><text x="105" y="239" class="label">User questionnaire</text>
  <text x="105" y="254" class="small">56 fixed-choice answers</text>

  <rect x="354" y="182" width="210" height="82" class="box"/>
  <text x="384" y="215" class="num">02 / GATE</text><text x="384" y="239" class="label">Input validation</text>
  <text x="384" y="254" class="small">Known IDs + enum allow-list</text>

  <rect x="633" y="182" width="210" height="82" class="safe"/>
  <text x="663" y="215" class="num">03 / MEMORY ONLY</text><text x="663" y="239" class="label">Feature extraction</text>
  <text x="663" y="254" class="small">Risk points · no raw storage</text>

  <rect x="912" y="182" width="210" height="82" class="box"/>
  <text x="942" y="215" class="num">04 / ANALYSIS</text><text x="942" y="239" class="label">Category scoring</text>
  <text x="942" y="254" class="small">Ten scores, each 0–100</text>

  <path d="M285 223H347M564 223H626M843 223H905" class="arrow"/>

  <!-- analyzers -->
  <text x="75" y="323" class="kicker">ANALYZER LANES / SEPARATE, EXPLAINABLE CATEGORIES</text>
  <g>
    <rect x="75" y="345" width="194" height="66" class="box2"/><text x="95" y="374" class="label">Profile + personal info</text><text x="95" y="394" class="small">Visibility · contact · context</text>
    <rect x="287" y="345" width="194" height="66" class="box2"/><text x="307" y="374" class="label">Location + content</text><text x="307" y="394" class="small">Timing · tags · media awareness</text>
    <rect x="499" y="345" width="194" height="66" class="box2"/><text x="519" y="374" class="label">Connections + tagging</text><text x="519" y="394" class="small">Approvals · social graph</text>
    <rect x="711" y="345" width="194" height="66" class="box2"/><text x="731" y="374" class="label">Account + third parties</text><text x="731" y="394" class="small">MFA · sessions · least privilege</text>
    <rect x="923" y="345" width="194" height="66" class="box2"/><text x="943" y="374" class="label">Social + footprint</text><text x="943" y="394" class="small">Message habits · historic review</text>
  </g>
  <path d="M1017 264V314H172V337M1017 314H384V337M1017 314H596V337M1017 314H808V337M1017 314H1020V337" class="arrow dash"/>

  <!-- scoring & output -->
  <rect x="180" y="468" width="255" height="86" class="safe"/>
  <text x="210" y="499" class="num">05 / WEIGHTED MODEL</text><text x="210" y="524" class="label">Overall risk + level</text><text x="210" y="542" class="small">LOW → MODERATE → HIGH → CRITICAL</text>
  <rect x="482" y="468" width="255" height="86" class="box"/>
  <text x="512" y="499" class="num">06 / COACHING</text><text x="512" y="524" class="label">Findings + recommendations</text><text x="512" y="542" class="small">Human-readable reasons + actions</text>
  <rect x="784" y="468" width="255" height="86" class="box"/>
  <text x="814" y="499" class="num">07 / USER OUTPUT</text><text x="814" y="524" class="label">Dashboard + report</text><text x="814" y="542" class="small">Radar · checklist · print / PDF</text>
  <path d="M596 411V449H307V460M435 511H474M737 511H776" class="arrow"/>

  <!-- simulator and database -->
  <rect x="104" y="626" width="370" height="82" class="box"/>
  <text x="134" y="658" class="num">WHAT-IF / NOT A PLATFORM CHANGE</text><text x="134" y="684" class="label">Improvement simulator</text><text x="134" y="700" class="small">Allow-listed safer answers · recalculates in memory</text>
  <rect x="571" y="626" width="490" height="82" class="sink"/>
  <text x="601" y="658" class="num">SQLITE / DERIVED DATA ONLY</text><text x="601" y="684" class="label">Assessment · category scores · finding types · recommendations</text><text x="601" y="700" class="small">No questionnaire answers, PII, passwords, photos, or exact location</text>
  <path d="M911 554V590H289V618M911 590H816V618" class="arrow dash"/>

  <!-- synthetic analytics -->
  <rect x="75" y="758" width="1042" height="52" fill="#101a1e" stroke="#53674c" stroke-dasharray="5 5" rx="12"/>
  <text x="99" y="790" class="num">SYNTHETIC ANALYTICS</text>
  <text x="268" y="790" class="small">1,200 generated fictional rows → cohort distribution / category averages / awareness charts</text>
  <path d="M360 708V741" class="arrow dash"/>
  <text x="1080" y="823" class="mono" text-anchor="end">EDUCATIONAL RUBRIC · NOT A COMPROMISE PREDICTION</text>
</svg>